name: cqn-lab-record
version: 1.0.0
description: |
  Declarative manifest for lab record skill. No axis — the template is
  always the same; variation is in how the input is extracted and classified.

always_load:
  - ../_shared/core/cqn-research-principles.md
  - ../_shared/core/cqn-engineering-claim-rules.md
  - ../_shared/core/cqn-source-grounding.md
  - ../_shared/templates/cqn-hardware-ledger-template.md
  - ../_shared/templates/cqn-lab-record-template.md
  - static/core/stance.md
  - static/core/workflow.md

references:
  on_demand:
    - condition: handling waveform captures and screenshots
      path: references/waveform-evidence.md
    - condition: documenting a debugging session or troubleshooting
      path: references/debug-decision-log.md
    - condition: tracking firmware/hardware/software versions
      path: references/version-tracking.md
