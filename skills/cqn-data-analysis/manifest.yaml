name: cqn-data-analysis
version: 1.0.0
description: |
  Declarative manifest for data analysis skill. Detects analysis type to load
  domain-specific references.

always_load:
  - ../_shared/core/cqn-research-principles.md
  - ../_shared/core/cqn-engineering-claim-rules.md
  - ../_shared/core/cqn-no-hallucination-policy.md
  - ../_shared/measurement/cqn-measurement-rules.md
  - ../_shared/measurement/cqn-fft-rules.md
  - ../_shared/measurement/cqn-calibration-rules.md
  - ../_shared/measurement/cqn-uncertainty-rules.md
  - static/core/stance.md
  - static/core/workflow.md

axes:
  analysis_type:
    detect: |
      Determine the type of data and analysis needed from the user's request.
    values:
      adc-analysis:      references/adc-analysis-formulas.md
      fft-analysis:      references/fft-parameter-guide.md
      three-phase:       references/three-phase-imbalance.md
      control-response:  references/control-response-metrics.md
      ai-metrics:        references/ai-deployment-metrics.md
    default: general

references:
  on_demand:
    - condition: computing THD from FFT or time-domain data
      path: references/thd-calculation.md
    - condition: need for an analysis script template
      path: scripts/analysis_template.py
