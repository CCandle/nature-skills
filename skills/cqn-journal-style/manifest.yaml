name: cqn-journal-style
version: 1.1.0
description: |
  Manuscript style alignment to target journal formats. Does not change
  technical claims or evidence.

always_load:
  - static/core/stance.md
  - static/core/workflow.md

axes:
  style:
    detect: |
      Determine the target journal style from the user's request.
    values:
      ieee:           static/fragments/style/ieee.md
      nature:         static/fragments/style/nature.md
      chinese-thesis: static/fragments/style/chinese-thesis.md
      generic:        static/fragments/style/generic.md
    default: generic
    multi: false

references:
  on_demand:
    - condition: verifying claims are preserved during style alignment
      path: references/style-without-claim-change.md
    - condition: comparing IEEE vs Nature conventions
      path: references/ieee-vs-nature-style.md
    - condition: aligning to Chinese engineering thesis format
      path: references/chinese-engineering-style.md
